# Production layer. Named after what it ADDS (running the code from the image), not after an
# environment — the same rule that gives us docker-compose.gpu.yml later.
#
# `include` rather than multi -f / COMPOSE_FILE: one `-f docker-compose.prod.yml` raises the
# whole chain, so there is a single command to remember and no way to forget the base.
include:
  - docker-compose.yml

services:

  api:
    # Listy w compose się SKLEJAJĄ, więc zwykłe `volumes:` dołożyłoby wpis do tych z bazy.
    # `!override` (Compose >= 2.24) zastępuje całą listę tą poniżej. Znika montowanie kodu
    # z hosta, bo prod uruchamia kod z obrazu, czyli dokładnie to, co zbudowaliśmy
    # i przetestowaliśmy. Znika też ./data: katalog artefaktów dostarcza na prod wdrożenie.
    #
    # Zostają dane klienta spoza repo, których nie da się wpiec w obraz: paczka kodu aplikacji
    # dla narzędzi agenta (p. 60), tylko do odczytu, oraz te części korpusu zgłoszeń, do których
    # pisze trasa zamknięcia zgłoszenia (p. 30) — karty, wątki po anonimizacji i surowe
    # zgłoszenia z trasy. Eksportu zrzutu bazy (`raw-db/`) kontener nie widzi.
    volumes: !override
      - ./data/unsafe/code:/code/data/unsafe/code:ro
      - ./data/unsafe/corpus/cards:/code/data/unsafe/corpus/cards
      - ./data/unsafe/corpus/anonymized:/code/data/unsafe/corpus/anonymized
      - ./data/unsafe/corpus/raw-route:/code/data/unsafe/corpus/raw-route
    # No --reload: the reloader watches the filesystem and restarts the worker on every write,
    # which is a development convenience and a liability in production.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  embedder:
    volumes: !reset []
    command: ["uvicorn", "embedder_app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  anonymizer:
    volumes: !reset []
    command: ["uvicorn", "anonymizer_app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    # Na prod front to pliki zbudowane w obrazie i nginx, bez serwera Vite i bez źródeł z hosta.
    build:
      context: ./frontend
      target:  prod
    volumes: !reset []
