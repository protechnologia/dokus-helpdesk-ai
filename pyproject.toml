[build-system]
requires      = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name            = "dokus-helpdesk-ai"
version         = "0.1.0"
description     = "LLM support for a helpdesk application and its implementation engineers"
requires-python = ">=3.12"

# Runtime dependencies deliberately live in api/requirements.txt (they go into the image);
# duplicating them here would give two sources of truth for the same fact.
dependencies = []

[project.scripts]
# Single entry-point for the whole production CLI tree; subcommands are @cli.command().
# Note: unusable until step 0c creates api/app/entry_cli/cli.py.
helpdesk = "app.entry_cli.cli:cli"

[tool.setuptools]
# Code lives in api/app/ because the folder is also the compose service; "api" is the import root,
# so `import app...` works identically on the host and inside the container.
package-dir = { "" = "api" }

[tool.setuptools.packages.find]
where = ["api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# `api` is importable through the editable install (package-dir above); the other services are not
# packaged at all — they only ship inside their own image. Adding their folder here lets a unit
# test import their pure logic (e.g. `embedder_app.vectors`) without installing them.
pythonpath = ["embedder"]

# importlib mode is required: the same file name may exist in two test folders, which makes the
# default prepend mode fail with "import file mismatch".
#
# The KIND of a test is its folder (tests/unit, integration, functional, evaluation); a MARKER says
# what the test needs to run. The default run is everything that needs nothing outside the repo:
# whatever is behind a marker needs a running service or a billable LLM and is asked for
# explicitly. `-m` on the command line replaces this value, so
# `pytest -m stack_embedder` still selects exactly what it names.
addopts = "--import-mode=importlib -m 'not stack and not llm_live'"

# The transport clients (LLM, embedder, Qdrant) are async, so their tests are coroutines.
# "auto" runs any `async def test_*` without decorating each one — no marker boilerplate.
asyncio_mode                       = "auto"
asyncio_default_fixture_loop_scope = "function"  # silences the pytest-asyncio unset-scope warning

markers = [
    "stack: umbrella for every test requiring a running service",
    "stack_api: requires a reachable api service",
    "stack_qdrant: requires a reachable Qdrant instance",
    "stack_embedder: requires a reachable embedder service",
    "stack_postgres: requires a reachable Postgres with the Polish dictionary",
    "llm_live: hits a real, billable LLM — outside the stack umbrella on purpose",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "I",  # import sorting (imports belong at the top of the module)
    "B",  # bugbear — catches bare-except-adjacent and mutable-default traps
    "UP", # pyupgrade — keeps syntax at the level of requires-python
]

# Vertical alignment of `=` is a deliberate project style (see CLAUDE.md → "Styl kodu").
# These whitespace rules exist precisely to forbid it, so they stay off.
ignore = [
    "E221", # multiple spaces before operator   — `name    = value`
    "E222", # multiple spaces after operator
    "E251", # spaces around keyword equals      — `timeout  = 60` in a call
    "E252", # missing whitespace around parameter equals
]

[tool.ruff.lint.per-file-ignores]
# Typer przekazuje metadane opcji przez wartość domyślną argumentu (`= typer.Option(...)`),
# FastAPI tak samo wstrzykuje zależności (`= Depends(...)`). To idiom obu frameworków, nie pułapka
# mutowalnego argumentu domyślnego, przed którą ostrzega B008.
"scripts/*.py"                  = ["B008"]
"api/app/entry_cli/**/*.py"     = ["B008"]
"api/app/entry_routers/**/*.py" = ["B008"]
# Stan grafu (`GraphState` w base.py i state.py grafów) ma komentarz inline przy każdym polu,
# a wyrównany typ `messages` sam zajmuje 89 znaków.
"api/app/agent_graphs/base.py"    = ["E501"]
"api/app/agent_graphs/*/state.py" = ["E501"]
# Tabela przypadków (tekst w bazie, zapytanie, oczekiwanie) czyta się wierszami; przełamana na
# kilka linii przestaje być tabelą.
"tests/integration/postgres/test_postgres_text_search_stack.py" = ["E501"]

[tool.ruff.lint.isort]
# Without this, `app` is taken for a third-party library and lands in the same block as pytest;
# declaring it keeps our own imports in a separate, last group.
known-first-party = ["app", "embedder_app"]
