[build-system]
requires      = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name            = "dokus-helpdesk-ai"
version         = "0.1.0"
description     = "LLM support for a helpdesk application and its implementation engineers"
requires-python = ">=3.12"

# Runtime dependencies deliberately live in api/requirements.txt (they go into the image);
# duplicating them here would give two sources of truth for the same fact.
dependencies = []

[project.scripts]
# Single entry-point for the whole production CLI tree; subcommands are @cli.command().
# Note: unusable until step 0c creates api/app/cli/cli.py.
helpdesk = "app.cli.cli:cli"

[tool.setuptools]
# Code lives in api/app/ because the folder is also the compose service; "api" is the import root,
# so `import app...` works identically on the host and inside the container.
package-dir = { "" = "api" }

[tool.setuptools.packages.find]
where = ["api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# `api` is importable through the editable install (package-dir above); the other services are not
# packaged at all — they only ship inside their own image. Adding their folder here lets a unit
# test import their pure logic (e.g. `embedder_app.vectors`) without installing them.
pythonpath = ["embedder"]

# importlib mode is required: the same file name may exist in tests/unit/ and tests/integration/,
# which makes the default prepend mode fail with "import file mismatch".
#
# The default run must be offline unit tests only: everything behind a marker needs a running
# service (or a billable LLM) and is asked for explicitly. `-m` on the command line replaces this
# value, so `pytest -m integration_embedder` still selects exactly what it names.
addopts = "--import-mode=importlib -m 'not integration and not functional and not llm_live'"

# The transport clients (LLM, embedder, Qdrant) are async, so their tests are coroutines.
# "auto" runs any `async def test_*` without decorating each one — no marker boilerplate.
asyncio_mode                       = "auto"
asyncio_default_fixture_loop_scope = "function"  # silences the pytest-asyncio unset-scope warning

markers = [
    "integration: umbrella for every test requiring a running service",
    "integration_api: requires a reachable api service",
    "integration_qdrant: requires a reachable Qdrant instance",
    "integration_embedder: requires a reachable embedder service",
    # Also needs the stack, but answers a different question: `integration` asks whether the
    # services are wired together, `functional` whether the product behaves ("this ticket in,
    # sensible hits out"). Separate umbrellas, so a slow product run is not the price of a
    # 30-second wiring check. No test carries it yet — the first arrives with POST /search.
    "functional: end-to-end product behaviour — outside the integration umbrella on purpose",
    "llm_live: hits a real, billable LLM — outside the integration umbrella on purpose",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "I",  # import sorting (imports belong at the top of the module)
    "B",  # bugbear — catches bare-except-adjacent and mutable-default traps
    "UP", # pyupgrade — keeps syntax at the level of requires-python
]

# Vertical alignment of `=` is a deliberate project style (see CLAUDE.md → "Styl kodu").
# These whitespace rules exist precisely to forbid it, so they stay off.
ignore = [
    "E221", # multiple spaces before operator   — `name    = value`
    "E222", # multiple spaces after operator
    "E251", # spaces around keyword equals      — `timeout  = 60` in a call
    "E252", # missing whitespace around parameter equals
]

[tool.ruff.lint.per-file-ignores]
# Typer przekazuje metadane opcji przez wartość domyślną argumentu (`= typer.Option(...)`).
# To idiom frameworka, nie pułapka mutowalnego argumentu domyślnego, przed którą ostrzega B008.
"scripts/*.py"     = ["B008"]
"api/app/cli/*.py" = ["B008"]

[tool.ruff.lint.isort]
# Without this, `app` is taken for a third-party library and lands in the same block as pytest;
# declaring it keeps our own imports in a separate, last group.
known-first-party = ["app", "embedder_app"]
